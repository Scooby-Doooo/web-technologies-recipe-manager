# Every push to main is tested, packed into a Docker image and deployed to Render.
# Pull requests only run the tests.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: sco0bydoo/recipe-manager

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/RecipeManager.Spa/package-lock.json
            tests/e2e/package-lock.json

      - name: Restore .NET tools
        run: dotnet tool restore

      # The E2E tests serve the SPA from wwwroot/spa, so it is built before the app.
      - name: Build SPA
        working-directory: src/RecipeManager.Spa
        run: |
          npm ci --ignore-scripts --no-fund
          npm run build

      - name: Build solution
        run: dotnet build WebTechnologies.sln

      # The tests start their own PostgreSQL and RabbitMQ containers and use the runner's Chrome.
      - name: E2E tests
        working-directory: tests/e2e
        run: |
          npm ci --ignore-scripts --no-fund
          npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://recipe-manager-iy74.onrender.com
    # A newer push waits for the running deploy instead of cancelling it halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: sco0bydoo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Render runs on x86-64. The commit tag tells Render exactly which image to deploy.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          image=$(jq -rn --arg value "docker.io/$IMAGE:$GITHUB_SHA" '$value | @uri')
          curl --fail --silent --show-error --output /dev/null -X POST "$DEPLOY_HOOK&imgURL=$image"
