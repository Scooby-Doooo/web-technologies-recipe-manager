services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipe_manager
      POSTGRES_USER: recipe_manager
      POSTGRES_PASSWORD: recipe_manager
    ports:
      - "5433:5432"
    volumes:
      - recipe-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe_manager -d recipe_manager"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: recipe_manager
      RABBITMQ_DEFAULT_PASS: recipe_manager
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - recipe-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    image: recipe-manager:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=recipe_manager;Username=recipe_manager;Password=recipe_manager
      RabbitMq__Url: amqp://recipe_manager:recipe_manager@rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - recipe-uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  recipe-db:
  recipe-rabbitmq:
  recipe-uploads:
